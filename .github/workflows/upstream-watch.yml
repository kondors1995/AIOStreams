name: Upstream Watch

# Every day at midnight UTC, looks at Viren070/AIOStreams for a smart-tv release newer than the one tizen-5.5 carries
# (packages/smart-tv/package.json, which an upstream merge brings along). If there is one it starts upstream-sync.yml
# for it: merge onto the branch aio-upstream (which does nothing when the branch or tizen-5.5 already holds that
# release), pre-TV checks, and one rolling pull request to tizen-5.5 to try on the TV before any release of ours.
#
# Scheduled workflows run from the default branch (tizen-5.5) and GitHub switches them off after 60 days without
# repository activity.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sync this upstream tag whatever the version (empty: the latest smart-tv release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      new: ${{ steps.latest.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
      FORCED: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/smart-tv/package.json
          sparse-checkout-cone-mode: false
      - name: Latest upstream smart-tv release against ours
        id: latest
        run: |
          set -eu
          ours=$(jq -r .version packages/smart-tv/package.json)
          tag="$FORCED"
          if [ -z "$tag" ]; then
            tag=$(gh release list -R Viren070/AIOStreams -L 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' \
              | grep -E '^smart-tv-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          fi
          if [ -z "$tag" ]; then
            echo "### No upstream smart-tv release found" >>"$GITHUB_STEP_SUMMARY"
            echo "new=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          theirs="${tag##*-v}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          newest=$(printf '%s\n%s\n' "$ours" "$theirs" | sort -V | tail -n 1)
          if [ -n "$FORCED" ] || { [ "$theirs" != "$ours" ] && [ "$newest" = "$theirs" ]; }; then
            echo "new=true" >>"$GITHUB_OUTPUT"
            echo "### Upstream has smart-tv $theirs (this fork carries $ours): starting a sync" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "new=false" >>"$GITHUB_OUTPUT"
            echo "### Upstream's latest smart-tv release is $theirs; this fork carries $ours: nothing to do" >>"$GITHUB_STEP_SUMMARY"
          fi

  sync:
    needs: check
    if: needs.check.outputs.new == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/upstream-sync.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    secrets: inherit
